name: Build and Release InfinityLib

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  EXPANSION_REPO: Sparkpixel-MC/InfinityExpansion-Folia

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build InfinityLib
    runs-on: ubuntu-latest
    outputs:
      Version: ${{ steps.version.outputs.Version }}
      Jar_Name: ${{ steps.jar.outputs.Jar_Name }}
      Jar_Path: ${{ steps.jar.outputs.Jar_Path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Get Version from Gradle
        id: version
        run: |
          set -e
          VERSION=$(./gradlew properties -q --console=plain | grep '^version:' | awk '{print $2}' | head -n1)
          VERSION=${VERSION#v}
          if [ -z "$VERSION" ]; then
            echo "Failed to read version from Gradle" >&2
            exit 1
          fi
          echo "Version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Verify version constant matches project version
        run: |
          set -e
          VERSION="${{ steps.version.outputs.Version }}"
          echo "Project version: $VERSION"
          if ! grep -q "\"$VERSION\"" src/main/java/io/github/mooy1/infinitylib/InfinityLib.java; then
            echo "::error::InfinityLib.VERSION in InfinityLib.java does not match the project version '$VERSION' - update both together!"
            exit 1
          fi

      - name: Build
        run: ./gradlew build shadowJar

      - name: Locate built jar
        id: jar
        run: |
          set -e
          JAR=$(find build/libs -maxdepth 1 -type f -name '*.jar' \
                  ! -name '*-unshaded*' ! -name '*-sources*' | head -n 1)
          if [ -z "$JAR" ]; then
            echo "No shaded JAR found in build/libs" >&2
            ls -la build/libs || true
            exit 1
          fi
          echo "Jar_Path=$JAR" >> "$GITHUB_OUTPUT"
          echo "Jar_Name=$(basename "$JAR")" >> "$GITHUB_OUTPUT"
          echo "Selected JAR: $JAR"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: InfinityLib
          path: ${{ steps.jar.outputs.Jar_Path }}
          if-no-files-found: error

  update-expansion:
    name: Update InfinityExpansion dependency
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download InfinityLib artifact
        uses: actions/download-artifact@v4
        with:
          name: InfinityLib
          path: artifacts

      - name: Locate downloaded jar
        id: jar
        run: |
          set -e
          JAR=$(find artifacts -maxdepth 1 -type f -name '*.jar' | head -n 1)
          if [ -z "$JAR" ]; then
            echo "No JAR found in artifacts" >&2
            ls -la artifacts || true
            exit 1
          fi
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"

      - name: Checkout expansion repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.EXPANSION_REPO }}
          token: ${{ secrets.PAT_TOKEN }}
          path: expansion

      - name: Copy jar into expansion libs/
        run: |
          mkdir -p expansion/libs
          cp "${{ steps.jar.outputs.jar }}" expansion/libs/InfinityLib.jar
          sha256sum expansion/libs/InfinityLib.jar

      - name: Commit and push
        run: |
          cd expansion
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add libs/InfinityLib.jar
          if git diff --cached --quiet; then
            echo "InfinityLib.jar is unchanged, nothing to commit"
          else
            git commit -m "chore(deps): update bundled InfinityLib to ${{ github.sha }} (${{ needs.build.outputs.Jar_Name }})"
            git push
            echo "Pushed update, InfinityExpansion's build workflow will run automatically."
          fi

  release:
    name: Publish Release
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: InfinityLib
          path: Release-Assets

      - name: List release assets
        run: find Release-Assets -type f | sort

      - name: Publish Release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: v${{ needs.build.outputs.Version }}
          name: InfinityLib v${{ needs.build.outputs.Version }}
          prerelease: false
          allowUpdates: true
          makeLatest: true
          artifactErrorsFailBuild: true
          removeArtifacts: true
          artifacts: Release-Assets/*.jar
          generateReleaseNotes: true
          body: |
            ## 🚀 InfinityLib v${{ needs.build.outputs.Version }}

            Automated build triggered by commit [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}) on `${{ github.ref_name }}`.

            ### 📦 Included Artifacts
            - **InfinityLib (shaded) JAR**: `${{ needs.build.outputs.Jar_Name }}`

            ### 🛠️ Installation
            1. Download the JAR from the assets below.
            2. Place it into your development environment `libs/` folder (or bundle it into your expansion).
            3. Restart your IDEA.

            ### 📝 Changelog
            The full changelog is auto-generated below. 👇

            ---
            _If you encounter any issues, please open an Issue and include your environment, modules, logs, config snippets, and reproduction steps._