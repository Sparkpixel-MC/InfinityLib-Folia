name: Build and Release InfinityLib

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Downstream repositories that bundle InfinityLib into their libs/ folder.
  # One repository per line (Owner/Repo), blank lines and # comments are ignored.
  # Each repo's build script must reference libs/InfinityLib.jar.
  DOWNSTREAM_REPOS: |
    Sparkpixel-MC/InfinityExpansion-Folia
    Sparkpixel-MC/FoxyMachines-Folia
    Sparkpixel-MC/SimpleUtils-Folia
  DOWNSTREAM_JAR_NAME: InfinityLib.jar

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build InfinityLib
    runs-on: ubuntu-latest
    outputs:
      Version: ${{ steps.version.outputs.Version }}
      Jar_Name: ${{ steps.jar.outputs.Jar_Name }}
      Jar_Path: ${{ steps.jar.outputs.Jar_Path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Get Version from Gradle
        id: version
        run: |
          set -e
          VERSION=$(./gradlew properties -q --console=plain | grep '^version:' | awk '{print $2}' | head -n1)
          VERSION=${VERSION#v}
          if [ -z "$VERSION" ]; then
            echo "Failed to read version from Gradle" >&2
            exit 1
          fi
          echo "Version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Verify version constant matches project version
        run: |
          set -e
          VERSION="${{ steps.version.outputs.Version }}"
          echo "Project version: $VERSION"
          if ! grep -q "\"$VERSION\"" src/main/java/io/github/mooy1/infinitylib/InfinityLib.java; then
            echo "::error::InfinityLib.VERSION in InfinityLib.java does not match the project version '$VERSION' - update both together!"
            exit 1
          fi

      - name: Build
        run: ./gradlew build shadowJar

      - name: Locate built jar
        id: jar
        run: |
          set -e
          JAR=$(find build/libs -maxdepth 1 -type f -name '*.jar' \
                  ! -name '*-unshaded*' ! -name '*-sources*' | head -n 1)
          if [ -z "$JAR" ]; then
            echo "No shaded JAR found in build/libs" >&2
            ls -la build/libs || true
            exit 1
          fi
          echo "Jar_Path=$JAR" >> "$GITHUB_OUTPUT"
          echo "Jar_Name=$(basename "$JAR")" >> "$GITHUB_OUTPUT"
          echo "Selected JAR: $JAR"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: InfinityLib
          path: ${{ steps.jar.outputs.Jar_Path }}
          if-no-files-found: error

  update-downstream:
    name: Update downstream dependencies
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download InfinityLib artifact
        uses: actions/download-artifact@v4
        with:
          name: InfinityLib
          path: artifacts

      - name: Push jar to all downstream repositories
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          JAR_NAME: ${{ needs.build.outputs.Jar_Name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          JAR=$(find artifacts -maxdepth 1 -type f -name '*.jar' | head -n 1)
          if [ -z "$JAR" ]; then
            echo "No JAR found in artifacts" >&2
            ls -la artifacts || true
            exit 1
          fi
          echo "Bundling JAR: $JAR"

          FAILED=0
          UPDATED=""
          while IFS= read -r repo; do
            repo="${repo//[[:space:]]/}"
            [ -z "$repo" ] && continue
            case "$repo" in "#"*) continue ;; esac

            echo "::group::Updating $repo"
            dir="downstream/$(echo "$repo" | tr '/' '_')"
            if ! git clone --depth 1 "https://x-access-token:${PAT_TOKEN}@github.com/${repo}.git" "$dir"; then
              echo "::error::Failed to clone $repo"
              FAILED=1
              echo "::endgroup::"
              continue
            fi

            # create libs/ if it does not exist in the downstream repository
            if [ ! -d "$dir/libs" ]; then
              echo "$repo: libs/ folder does not exist, creating it"
              mkdir -p "$dir/libs"
            fi
            cp "$JAR" "$dir/libs/${{ env.DOWNSTREAM_JAR_NAME }}"
            sha256sum "$dir/libs/${{ env.DOWNSTREAM_JAR_NAME }}"

            cd "$dir"
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            if git check-ignore -q "libs/${{ env.DOWNSTREAM_JAR_NAME }}"; then
              echo "::warning::$repo ignores libs/ via .gitignore, force-adding the jar anyway"
              git add -f "libs/${{ env.DOWNSTREAM_JAR_NAME }}"
            else
              git add "libs/${{ env.DOWNSTREAM_JAR_NAME }}"
            fi
            if git diff --cached --quiet; then
              echo "$repo: jar unchanged, nothing to commit"
            elif git commit -m "chore(deps): update bundled InfinityLib to ${COMMIT_SHA:0:7} (${JAR_NAME})" \
                            -m "Upstream: https://github.com/${{ github.repository }}/commit/${COMMIT_SHA}" \
                 && git push; then
              echo "$repo: pushed update"
              UPDATED="$UPDATED $repo"
            else
              echo "::error::Failed to commit/push to $repo"
              FAILED=1
            fi
            cd - > /dev/null
            echo "::endgroup::"
          done < <(printf '%s\n' "$DOWNSTREAM_REPOS")

          echo "Updated repositories:${UPDATED:- none}"
          exit $FAILED

  release:
    name: Publish Release
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: InfinityLib
          path: Release-Assets

      - name: List release assets
        run: find Release-Assets -type f | sort

      - name: Publish Release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: v${{ needs.build.outputs.Version }}
          name: InfinityLib v${{ needs.build.outputs.Version }}
          prerelease: false
          allowUpdates: true
          makeLatest: true
          artifactErrorsFailBuild: true
          removeArtifacts: true
          artifacts: Release-Assets/*.jar
          generateReleaseNotes: true
          body: |
            ## 🚀 InfinityLib v${{ needs.build.outputs.Version }}

            Automated build triggered by commit [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}) on `${{ github.ref_name }}`.

            ### 📦 Included Artifacts
            - **InfinityLib (shaded) JAR**: `${{ needs.build.outputs.Jar_Name }}`

            ### 🛠️ Installation
            1. Download the JAR from the assets below.
            2. Place it into your development environment `libs/` folder (or bundle it into your expansion).
            3. Restart your IDEA.

            ### 📝 Changelog
            The full changelog is auto-generated below. 👇

            ---
            _If you encounter any issues, please open an Issue and include your environment, modules, logs, config snippets, and reproduction steps._
