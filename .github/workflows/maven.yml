name: Build and Update External Lib

on:
  workflow_dispatch:
  push:
    branches: [ main , master ]

jobs:
  Update-Lib:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Current Repository
        uses: actions/checkout@v4
        with:
          path: current

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Build Maven Project
        run: |
          cd current
          mvn clean package

      - name: Get Project Info
        id: project_info
        run: |
          cd current
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          ARTIFACT_ID=$(mvn help:evaluate -Dexpression=project.artifactId -q -DforceStdout)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "artifact_id=$ARTIFACT_ID" >> $GITHUB_OUTPUT

      - name: Checkout Target Repository
        uses: actions/checkout@v4
        with:
          repository: Sparkpixel-MC/InfinityExpansion-Folia
          token: ${{ secrets.PAT_TOKEN }}
          path: target-repo

      - name: Copy Built Jar To Libs And Rename
        run: |
          mkdir -p target-repo/libs
          cp current/target/${{ steps.project_info.outputs.artifact_id }}-${{ steps.project_info.outputs.version }}.jar target-repo/libs/InfinityLib.jar

      - name: Commit And Push Changes
        run: |
          cd target-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add libs/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update ${{ steps.project_info.outputs.artifact_id }} lib to version ${{ steps.project_info.outputs.version }}"
            git push
          fi